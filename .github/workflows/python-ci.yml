name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: 'Also check the two public news websites'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit + offline full pipeline (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_v2.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_v2.txt
      - name: Check Python syntax
        run: python -m compileall -q jrjj_v2.py test_jrjj_v2.py scripts/live_smoke.py
      - name: Run offline tests
        run: python -m unittest discover -v -p 'test_*.py'
      - name: Check CLI help
        run: python jrjj_v2.py --help

  live-smoke:
    name: Optional real-website smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_v2.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_v2.txt
      - name: Check both live lists and sample articles
        run: python scripts/live_smoke.py
