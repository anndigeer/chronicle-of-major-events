name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: 'Check real news sites (may fail if sites block CI)'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# Windows runners otherwise may default to cp1252 when Python writes Chinese CLI help.
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  unit-tests:
    name: Offline tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements_v2.txt

      - name: Install dependencies
        run: python -m pip install -r requirements_v2.txt

      - name: Check repository completeness and environment
        run: python scripts/check_ci.py

      - name: Check script syntax
        run: python -m compileall -q jrjj_v2.py test_jrjj_v2.py scripts/

      - name: Run offline regression tests
        run: python -m unittest -v test_jrjj_v2

      - name: Check command-line interface with legacy Windows codepage
        run: python jrjj_v2.py --help
        env:
          PYTHONIOENCODING: cp1252

  live-smoke:
    name: Optional live website verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_v2.txt
      - name: Install dependencies
        run: python -m pip install -r requirements_v2.txt
      - name: Verify public news sources and article extraction
        run: python scripts/live_smoke.py

  government-xml-test:
    name: One-time government XML and leader-article smoke test
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[gov-xml-test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_v2.txt
      - name: Fetch government XML and matching article bodies
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: utf-8
        run: python scripts/test_government_xml.py
      - name: Upload diagnostics regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: government-xml-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
