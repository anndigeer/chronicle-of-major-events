name: Cleanup obsolete branches (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-obsolete-branches-once.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove obsolete refs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          for branch in \
            actions/september-2026-extract \
            automation/september-2026-export \
            ci/september-2026-export \
            ci/verify-offline-suite \
            diagnostics/gov-xml-20261021 \
            refactor/jjxw-only-mips64 \
            run/september-2026-once \
            runs/september-2026-dual-20261021 \
            test/september-dual-source-20261021 \
            testing/streamlined-government-xml-20261021
          do
            echo "Deleting: ${branch}"
            status=$(curl --silent --show-error --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output /tmp/delete-ref-response --write-out "%{http_code}" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/git/refs/heads/${branch}")
            if [[ "$status" == 204 || "$status" == 404 ]]; then
              echo "OK: ${branch} (HTTP ${status})"
            else
              echo "ERROR: ${branch} (HTTP ${status})"
              cat /tmp/delete-ref-response
              exit 1
            fi
          done
