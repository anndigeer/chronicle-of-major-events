name: News collection (manual)
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM'
        type: string
        required: true
        default: '2026-09'
permissions:
  contents: read
concurrency:
  group: news-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect target month
        id: collect
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          python -u main.py "${{ inputs.month }}" 2>&1 | tee results/collection.log
      - name: Verify results
        id: verify
        if: always()
        continue-on-error: true
        run: python main.py "${{ inputs.month }}" --verify
      - name: Upload exported files and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-month-export
          path: results/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on collect or verification errors
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$COLLECT" = success
          test "$VERIFY" = success
