name: News collection (manual)
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM'
        type: string
        required: true
        default: '2026-09'
permissions:
  contents: read
concurrency:
  group: news-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect one month from Jiujiang News
        id: collect
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p results
          set -o pipefail
          python -u main.py --month "${{ inputs.month }}" --only-month \
            --content-scope month --max-pages 15 \
            --excel results/jiujiang_news.xlsx \
            --database results/jiujiang_cache.sqlite3 \
            --output-dir results --debug-dir results/debug_html \
            2>&1 | tee results/collection.log
      - name: Verify month output
        id: verify
        if: always()
        continue-on-error: true
        run: python scripts/verify_month_output.py --month "${{ inputs.month }}" --folder results
      - name: Upload results, logs and cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-month-export
          path: results/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on collection or validation errors
        if: always()
        env:
          COLLECT: ${{ steps.collect.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
        run: |
          test "$COLLECT" = success
          test "$VERIFY" = success
