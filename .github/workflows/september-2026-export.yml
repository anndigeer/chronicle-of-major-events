name: September 2026 collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source_feeds.py'
      - 'jrjj_v2.py'
      - '.github/workflows/september-2026-export.yml'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements_v2.txt
      - name: Collect September 2026
        run: |
          mkdir -p results
          python jrjj_v2.py --month 2026-09 --year 2026 --only-month --mode all --content-scope month --max-pages 12 --excel results/jiujiang_news.xlsx --database results/jiujiang_cache.sqlite3 --output-dir results --debug-dir results/debug_html > results/collection.log 2>&1
      - name: Verify output
        if: always()
        run: python scripts/verify_exports.py
      - name: Upload all generated xlsx and docx
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: september-2026-output
          path: |
            results/*.xlsx
            results/*.docx
            results/*.log
            results/debug_html/**
            results/*.json
            results/*.txt
          if-no-files-found: warn
          retention-days: 30
